---
- name: Ensure apt dependencies are present.
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg2
    state: present

# Sélectionne dépôt, clé GPG et listes de paquets selon la source active.
- name: Select Varnish apt repository parameters.
  ansible.builtin.set_fact:
    varnish_apt_repo_uri: >-
      {{ varnish_official_apt_repo_url
         if varnish_apt_repo_source == 'official'
         else varnish_packagecloud_apt_repo_url }}
    varnish_apt_repo_key_url: >-
      {{ varnish_official_apt_key_url
         if varnish_apt_repo_source == 'official'
         else varnish_packagecloud_apt_key_url }}
    varnish_apt_install_packages: >-
      {{ varnish_apt_packages_by_source[varnish_apt_repo_source].install
         + varnish_apt_extra_packages }}
    varnish_apt_remove_packages: >-
      {{ varnish_apt_packages_by_source[varnish_apt_repo_source].conflicts }}
  when: varnish_apt_repo_source != 'distribution'

- name: Select Varnish apt package lists (distribution source).
  ansible.builtin.set_fact:
    varnish_apt_install_packages: >-
      {{ varnish_apt_packages_by_source.distribution.install
         + varnish_apt_extra_packages }}
    varnish_apt_remove_packages: >-
      {{ varnish_apt_packages_by_source.distribution.conflicts }}
  when: varnish_apt_repo_source == 'distribution'

# Nettoie l'ancien nom de fichier du fork (packagecloud) avant migration.
- name: Remove obsolete Varnish apt source file.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/varnish-cache.list
    state: absent
  when: varnish_apt_repo_source != 'distribution'

# Évite le conflit "Signed-By" quand le même dépôt existe dans les deux
# formats (ex: enregistré à la main en .list, puis géré ici en .sources).
- name: Remove conflicting .list Varnish repository (deb822 mode).
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/varnish.list
    state: absent
  when:
    - varnish_apt_repo_source != 'distribution'
    - varnish_apt_use_deb822 | bool

- name: Remove conflicting .sources Varnish repository (legacy .list mode).
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/varnish.sources
    state: absent
  when:
    - varnish_apt_repo_source != 'distribution'
    - not (varnish_apt_use_deb822 | bool)

# Format moderne deb822 : le module télécharge la clé dans
# /etc/apt/keyrings/varnish.asc et écrit le Signed-By correspondant.
- name: Add Varnish apt repository (deb822).
  ansible.builtin.deb822_repository:
    name: varnish
    types: [deb]
    uris: "{{ varnish_apt_repo_uri }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: [main]
    signed_by: "{{ varnish_apt_repo_key_url }}"
    state: present
  when:
    - varnish_apt_repo_source != 'distribution'
    - varnish_apt_use_deb822 | bool

# Repli format .list : la clé est déposée dans /usr/share/keyrings au
# chemin exact référencé par signed-by (cohérence clé <-> dépôt).
- name: Add Varnish apt signing key (legacy .list).
  ansible.builtin.get_url:
    url: "{{ varnish_apt_repo_key_url }}"
    dest: /usr/share/keyrings/varnish-archive-keyring.asc
    mode: '0644'
    force: true
  when:
    - varnish_apt_repo_source != 'distribution'
    - not (varnish_apt_use_deb822 | bool)

- name: Add Varnish apt repository (legacy .list).
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/varnish-archive-keyring.asc] {{ varnish_apt_repo_uri }} {{ ansible_facts.distribution_release }} main"
    filename: varnish
    state: present
  when:
    - varnish_apt_repo_source != 'distribution'
    - not (varnish_apt_use_deb822 | bool)

# Épinglage de la version : indispensable car un dépôt « rolling » peut
# servir plusieurs lignes (7.x, 8.x, 9.x) simultanément.
- name: Pin Varnish package version.
  ansible.builtin.template:
    src: varnish.pref.j2
    dest: /etc/apt/preferences.d/varnish.pref
    owner: root
    group: root
    mode: '0644'
  when: varnish_apt_pin_version | length > 0

# state: latest requis pour appliquer le pinning (upgrade 7.7 -> 8.0, etc.).
# state: present ne fait qu'assurer la présence du paquet, sans changer la version.
- name: Ensure Varnish is installed.
  ansible.builtin.apt:
    name: "{{ varnish_apt_install_packages }}"
    state: "{{ 'latest' if varnish_apt_pin_version | length > 0 else 'present' }}"
    update_cache: true
    autoremove: true

# Retire les paquets incompatibles avec la source active (orphelins d'une
# autre source, ex: libvarnishapi3 Debian après bascule vers official).
- name: Remove conflicting Varnish packages for active repository source.
  ansible.builtin.apt:
    name: "{{ varnish_apt_remove_packages }}"
    state: absent
    purge: true
    autoremove: true
  when: varnish_apt_remove_packages | length > 0

- name: Ensure Varnish VMODs are installed.
  ansible.builtin.apt:
    name: "{{ varnish_modules_package_name }}"
    state: "{{ 'latest' if varnish_apt_pin_version | length > 0 else 'present' }}"
    autoremove: true
  when: varnish_modules_package_name | length > 0
