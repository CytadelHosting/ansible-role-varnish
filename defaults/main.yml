---
varnish_package_name: "varnish"
varnish_modules_package_name: ""
varnish_version: "6.6"

# forked from geerlingguy
# should this role override packages's SysVinit and systemd startup scripts
# default: false (keep package's scripts)
# geerlingguy: true
varnish_role_override_startup_scripts: false

# Override PARTIEL du démarrage via un drop-in systemd : le unit du paquet
# reste intact, on redéfinit seulement ExecStart (adresse/port d'écoute,
# admin, storage, varnishd_extra_options). C'est le moyen recommandé pour
# faire écouter Varnish ailleurs que sur le port par défaut du paquet.
# Ignoré si varnish_role_override_startup_scripts vaut true.
varnish_systemd_dropin: true

# 644 in geerlingguy role, 600 in default distribution package
varnish_secret_file_privileges: '600'

varnish_use_default_vcl: true
varnish_default_vcl_template_path: default.vcl.j2
varnish_vcl_version: "{{ '4.1' if varnish_version is version('6.0', '>=') else '4.0' }}"

varnish_default_backend_host: "127.0.0.1"
varnish_default_backend_port: "8080"

varnish_listen_address: ""
varnish_listen_port: "80"
varnish_secret: "14bac2e6-1e34-4770-8078-974373b76c90"
varnish_config_path: /etc/varnish
varnish_limit_nofile: 131072

varnish_admin_listen_host: "127.0.0.1"
varnish_admin_listen_port: "6082"

varnish_storage: "file,/var/lib/varnish/varnish_storage.bin,256M"
varnish_pidfile: /run/varnishd.pid

varnishd_extra_options: ""

varnish_enabled_services:
  - varnish

# Make sure Packagecloud repo is used on RHEL/CentOS.
varnish_packagecloud_repo_yum_repository_priority: "1"

# Only used on RedHat / CentOS.
varnish_yum_repo_baseurl: https://packagecloud.io/varnishcache/{{ varnish_packagecloud_repo }}/el/{{ ansible_facts.distribution_major_version|int }}/$basearch

# --- Dépôt APT (Debian / Ubuntu uniquement) -------------------------------
# Source du dépôt Varnish :
#   official     -> dépôt officiel Varnish Software (packages.varnish-software.com)
#   packagecloud -> dépôt communautaire packagecloud.io (versionné, ex: varnish80)
#   distribution -> dépôt natif de l'OS (on n'ajoute aucun dépôt externe)
varnish_apt_repo_source: official

# Dépôt officiel : sert la dernière ligne stable (l'épinglage ci-dessous
# choisit la version effective). Le codename réel de l'OS est utilisé.
varnish_official_apt_repo_url: "https://packages.varnish-software.com/varnish/{{ ansible_facts.distribution | lower }}"
varnish_official_apt_key_url: "https://packages.varnish-software.com/varnish/varnish.pub.asc"

# Dépôt packagecloud.io : versionné par ligne via varnish_packagecloud_repo.
varnish_packagecloud_apt_repo_url: "https://packagecloud.io/varnishcache/{{ varnish_packagecloud_repo }}/{{ ansible_facts.distribution | lower }}"
varnish_packagecloud_apt_key_url: "https://packagecloud.io/varnishcache/{{ varnish_packagecloud_repo }}/gpgkey"

# Format moderne deb822 (.sources) quand la distro le supporte.
# Forcez à false pour garder l'ancien format .list (ex: Debian 11/12).
varnish_apt_use_deb822: "{{ (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int >= 11) or (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('20.04', '>=')) }}"

# Paquets supplémentaires ajoutés à la liste install de la source active
# (ex: varnish-dev). Voir vars/Debian.yml -> varnish_apt_packages_by_source.
varnish_apt_extra_packages: []

# Épinglage (apt pinning) de la version, dérivé de varnish_version :
#   '8.0'   -> '8.0*'   (dernier patch de la ligne 8.0.x)
#   '8.0.2' -> '8.0.2*' (cible exacte)
# Mettez '' pour désactiver l'épinglage et laisser apt choisir la plus récente.
varnish_apt_pin_version: "{{ varnish_version }}*"
varnish_apt_pin_priority: "1001"

# --- VCL avancé (bibliothèque de templates CMS) ---------------------------
# Pour un VCL riche, pointez varnish_default_vcl_template_path vers un
# template de la bibliothèque, ex :
#   varnish_default_vcl_template_path: advanced/wordpress.vcl.j2
# Les options principales sont injectées via varnish_vcl_config ci-dessous ;
# le gros de la logique (purge, cache, sécurité) est pré-positionné dans le
# template. Surchargez tout ou partie de ce dict dans vos group_vars.
varnish_vcl_config:
  # Modules (VMODs) importés en tête de VCL.
  imports:
    - std
  # ACLs (clé -> liste d'hôtes/IP/CIDR autorisés).
  acls:
    purge:
      - localhost
      - "127.0.0.1"
      - "::1"
  # Fichiers statiques : extensions mises en cache et durée de vie associée.
  static_files:
    extensions: "7z|avi|bmp|bz2|css|csv|doc|docx|eot|flac|flv|gif|gz|ico|jpeg|jpg|js|less|mka|mkv|mov|mp3|mp4|mpeg|mpg|odt|ogg|ogm|opus|otf|pdf|png|ppt|pptx|rar|rtf|svg|svgz|swf|tar|tbz|tgz|ttf|txt|txz|wav|webm|webp|woff|woff2|xls|xlsx|xml|xz|zip"
    ttl: "1d"
  # TTL par défaut appliqué quand le backend ne renvoie pas de Cache-Control.
  cache_control:
    default_ttl: "1h"
  # URLs jamais mises en cache (motifs regex testés sur req.url).
  skip_cache_urls:
    - "^/wp-admin"
    - "^/wp-login.php"
    - "^/cart"
    - "^/checkout"
    - "^/my-account"
  # En-têtes de requête supprimés pour des raisons de sécurité.
  security:
    remove_headers:
      - proxy
  # Ports considérés comme HTTPS pour positionner X-Forwarded-Proto.
  https:
    detect_ports:
      - 443
      - 8443
  # Normalisations de requête (cache hit ratio).
  request_cleaning:
    strip_empty_query: true
    normalize_host: true
    sort_query: true
  # Cookies dont la présence ne doit pas empêcher la mise en cache.
  cookies:
    strip_patterns:
      - "wfvt_"
      - "wordfence_verifiedHuman"

# Optionally define additional backends.
# varnish_backends:
#   apache:
#     host: 10.0.2.2
#     port: 80
#   nodejs:
#     host: 10.0.2.3
#     port: 80

# Optionally define vhosts pointed at different backends.
# varnish_vhosts:
#   example.com:
#     backend: apache
#   nodejs.example.com:
#     backend: nodejs
